[build-system]
# Hatchling writes PEP 639 license metadata from 1.27.0 on.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deadreckoning"
version = "0.1.0"
description = "An agent runtime for environments where dependencies fail without warning."
readme = "README.md"
requires-python = ">=3.11"
# An SPDX license expression and the files that carry it, as PEP 639 defines them.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MithrilBytes" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
dr = "deadreckoning.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deadreckoning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "demo", "hub"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "BLE", "TRY"]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["src", "tests", "demo", "hub"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pytest script, unlike python -m pytest, leaves the working directory off sys.path,
# and the scenario tests import demo and hub from the repository root.
# https://docs.pytest.org/en/stable/explanation/pythonpath.html
pythonpath = ["."]
addopts = "-q"
