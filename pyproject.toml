[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadreckoning"
version = "0.1.0"
description = "An agent runtime for environments where dependencies fail without warning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MithrilBytes" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
dr = "deadreckoning.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deadreckoning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "demo", "hub"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "BLE", "TRY"]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["src", "tests", "demo", "hub"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
