# make check, the pins and the reference scenario, on Linux and on macOS arm64.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token can only read it.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions:
  contents: read

# A newer push to a pull request makes its older run moot. Runs on main are left to
# finish so that every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Naming bash adds -o pipefail to -e, and the demo step pipes through tee.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # A failure on one platform says nothing about the other, so both run to the end.
      fail-fast: false
      matrix:
        # macos-26 is the arm64 image.
        # https://github.com/actions/runner-images#available-images
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    # The default is 360 minutes, which a hung test would spend in full.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs, since a tag can be moved to other code.
      # https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token is not left in the git config for later steps.
          persist-credentials: false

      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          # Caches pip's download directory, keyed on the files that decide what it holds.
          # https://github.com/actions/setup-python#caching-packages-dependencies
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: install
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: make install PYTHON="$PYTHON"

      - name: lock
        run: make lock-check

      - name: lint
        run: make lint

      - name: typecheck
        run: make typecheck

      - name: test
        run: time make test

      # The scenario exits 0 whether or not the chains verify, so the step checks each
      # node's report rather than trusting the exit status. Counting per node means a
      # repeated line from one node cannot stand in for a missing line from another.
      - name: demo
        run: |
          make demo | tee "$RUNNER_TEMP/demo.log"
          status=0
          for node in truck-7 truck-12 hq-hub; do
            count=$(grep -cE "^  $node: ok, " "$RUNNER_TEMP/demo.log" || true)
            if [ "$count" != 1 ]; then
              echo "expected one ok line from $node, found $count" >&2
              status=1
            fi
          done
          exit "$status"
