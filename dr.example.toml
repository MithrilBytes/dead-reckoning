# Dead Reckoning example configuration.
# Copy to dr.toml. Secrets are referenced by environment variable name only.

profile = "demo"                  # demo | production ; chaos refuses to enable under production

[node]
node_id = "truck-7"
data_dir = "./data/truck-7"

# ---- Model tiers: rank 0 is highest fidelity ---------------------------------
[[tiers]]
name = "frontier"
rank = 0
kind = "remote"
base_url = "https://api.example.com/v1"
model = "some-frontier-model"
api_key_env = "FRONTIER_API_KEY"
supports_tools = true
connect_timeout_s = 3
read_timeout_s = 60
slow_threshold_ms = 8000
canary = true

[[tiers]]
name = "local-q8"
rank = 1
kind = "local"                    # local, not onprem: an onprem tier alive would prevent ISLANDED
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b-instruct-q8_0"
supports_tools = false
connect_timeout_s = 2
read_timeout_s = 180
slow_threshold_ms = 60000
canary = true                     # must be probed: the router can only select HEALTHY or SLOW tiers

[[tiers]]
name = "local-q4"
rank = 2
kind = "local"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b-instruct-q4_K_M"
supports_tools = false            # use the JSON-in-text protocol
connect_timeout_s = 2
read_timeout_s = 120
slow_threshold_ms = 30000
canary = false                    # local tier: passive observation only

# ---- Non-model dependencies --------------------------------------------------
[[dependencies]]
name = "gis-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/gis"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "scada-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/scada"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "ticket-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/tickets"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "dispatch-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/dispatch"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "notify-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/notify"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "weather-api"
type = "TOOL_BACKEND"
base_url = "http://127.0.0.1:8710/weather"
canary = { method = "HEAD", path = "/health" }

[[dependencies]]
name = "fake-idp"
type = "IDP"
base_url = "http://127.0.0.1:8720"
token_env = "DR_IDP_CLIENT_SECRET"

[[dependencies]]
name = "time-source"
type = "TIME_SOURCE"
base_url = "http://127.0.0.1:8710"    # reads the Date header; NTP optional in v0.2

[[dependencies]]
name = "hq-hub"
type = "SYNC_HUB"
base_url = "http://127.0.0.1:8700"
token_env = "DR_HUB_TOKEN"

# ---- Tool contract overrides (code-declared contracts are the default) --------
[[tools]]
name = "list_open_tickets"
staleness_budget_s = 3600

[[tools]]
name = "weather_forecast"
hydrate = { static_args = [{ area = "SB-3" }], max_rows = 32 }

# ---- Task classes -------------------------------------------------------------
[task_classes.triage]
min_rank = 2
review_above_rank = 1
max_tokens_total = 20000
max_wall_s = 600
max_steps = 12

[task_classes.dispatch]
min_rank = 1
review_above_rank = 0
max_tokens_total = 20000
max_wall_s = 600
max_steps = 8

# ---- Health -------------------------------------------------------------------
[health]
canary_interval_s = 15
open_after_consecutive_failures = 3
half_open_backoff_initial_s = 5
half_open_backoff_max_s = 120
close_after_consecutive_successes = 2
up_dwell_s = 10
rate_limit_window_s = 60

# ---- Identity -----------------------------------------------------------------
[identity]
fresh_window_s = 900
cached_grant_ttl_s = 28800

# ---- Time ---------------------------------------------------------------------
[time]
time_fresh_s = 3600
time_stale_s = 86400
skew_threshold_s = 300

# ---- Sync ---------------------------------------------------------------------
[sync]
interval_s = 30
page_size = 500
peers = []                        # optional direct peers, e.g. ["http://truck-12.local:8600"]

# ---- Provisioning -------------------------------------------------------------
[provisioning]
auto = false                      # fill local caches on a timer while CONNECTED
interval_s = 300                  # maintenance pass period; READY drain runs even when auto is false
horizon_s = 36000                 # default look ahead for dr forecast, 10 hours
max_rows_per_tool = 5000          # ceiling; a tool's own hydrate.max_rows may be lower
max_wall_s = 60                   # a pass stops cleanly past this and records what it achieved
max_calls_per_pass = 500

# ---- Chaos (demo only) --------------------------------------------------------
[chaos]
enabled = true

# ---- Redaction ----------------------------------------------------------------
[redaction]
keys = ["api_key", "authorization", "token", "secret", "password"]
